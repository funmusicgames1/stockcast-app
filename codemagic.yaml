workflows:
  ios-build:
    name: StockCast iOS Build
    max_build_duration: 60
    environment:
      node: 22.0.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Sync Capacitor
        script: |
          chmod +x node_modules/.bin/cap
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/App/ExportOptions.plist

    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - premchander.tech@gmail.com
        notify:
          success: true
          failure: true
