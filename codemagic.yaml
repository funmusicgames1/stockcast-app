workflows:
  ios-build:
    name: StockCast iOS Build
    max_build_duration: 60
    environment:
      node: 22.0.0
      xcode: latest
      vars:
        BUNDLE_ID: "com.stockcast.app"
        XCODE_WORKSPACE: "ios/App/App.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Sync Capacitor
        script: |
          chmod +x node_modules/.bin/cap
          npx cap sync ios

      - name: Set up code signing
        script: |
          # Use unsigned build for direct install via AltStore/Sideloadly
          echo "Building unsigned IPA for sideloading"

      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

          # Package into IPA manually
          mkdir -p build/Payload
          cp -r "build/DerivedData/Build/Products/Debug-iphoneos/App.app" build/Payload/
          cd build
          zip -r StockCast.ipa Payload/

    artifacts:
      - build/StockCast.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - premchander.tech@gmail.com
        notify:
          success: true
          failure: true
